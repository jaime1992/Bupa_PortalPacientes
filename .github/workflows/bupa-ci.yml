name: BUPA Portal Pacientes — QA Pipeline  # nombre del pipeline que aparece en GitHub Actions

on:  # define CUÁNDO se activa el pipeline (los triggers)
  push:
    branches: [feature/bupa-*, develop, master, main]  # se activa al hacer push a cualquiera de estas ramas
  pull_request:
    branches: [main, develop, master]  # se activa cuando abres o actualizas un PR hacia estas ramas
  schedule:
    - cron: '50 7 * * 1-5'    # corre automáticamente lunes a viernes a las 7:50am UTC (4:50am Chile)
  workflow_dispatch:            # agrega botón manual en GitHub para disparar el pipeline cuando quieras

jobs:  # define todos los stages del pipeline

  # ─────────────────────────────────────────────────
  # STAGE 1 — INSTALAR DEPENDENCIAS
  # ─────────────────────────────────────────────────
  install:
    name: Instalar dependencias          # nombre que aparece en GitHub Actions UI
    runs-on: ubuntu-latest               # servidor Linux donde corre — GitHub lo prende y apaga solo
    steps:
      - name: Checkout código
        uses: actions/checkout@v4        # baja el código del repo al servidor — siempre el primer step

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4      # instala Node.js en el servidor
        with:
          node-version: 20               # versión de Node que usa el proyecto
          cache: 'npm'                   # cachea node_modules para acelerar los siguientes jobs

      - name: Instalar dependencias
        run: npm ci                      # instala exactamente lo que dice package-lock.json (más seguro que npm install)

  # ─────────────────────────────────────────────────
  # STAGE 2 — SEGURIDAD (paralelo con smoke)
  # ─────────────────────────────────────────────────
  security:
    name: Auditoría de seguridad
    needs: install                       # espera que Stage 1 termine antes de arrancar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Verificar vulnerabilidades HIGH
        run: npm audit --audit-level=high --ignore-scripts  # revisa si alguna dependencia tiene vulnerabilidad HIGH o CRITICAL
        continue-on-error: true  # si falla no detiene el pipeline — xlsx no tiene fix disponible aún

  # ─────────────────────────────────────────────────
  # STAGE 3 — SMOKE TESTS (portal vivo?)
  # ─────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests — Portal vivo
    needs: install                       # corre en paralelo con security — ambos esperan solo Stage 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Correr smoke tests BUPA
        run: npx cypress run --spec "cypress/e2e/bupa/bupa-smoke*"  # corre solo los specs smoke (los más críticos)
        env:
          CYPRESS_BUPA_USER: ${{ secrets.BUPA_USER }}  # credencial guardada en GitHub Secrets — nunca en el código
          CYPRESS_BUPA_PASS: ${{ secrets.BUPA_PASS }}  # credencial guardada en GitHub Secrets — nunca en el código

      - name: Guardar evidencia smoke
        uses: actions/upload-artifact@v4  # guarda los archivos como evidencia descargable en GitHub
        if: always()                      # guarda la evidencia aunque el test haya fallado
        with:
          name: smoke-evidencia
          path: |
            cypress/reports/              # reporte Mochawesome
            cypress/screenshots/          # capturas de pantalla de fallos
          retention-days: 30              # GitHub borra estos archivos después de 30 días

  # ─────────────────────────────────────────────────
  # STAGE 4 — TESTS CRÍTICOS
  # ─────────────────────────────────────────────────
  tests-criticos:
    name: Tests Críticos — Portal Pacientes
    needs: smoke-tests                   # espera que smoke pase — si smoke falla esto NO corre
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                   # si un spec falla, los otros SIGUEN corriendo (no se detienen)
      matrix:                            # matrix = corre cada spec en paralelo como job separado
        spec:
          - "cypress/e2e/bupa/bupa-login*"       # job 1 — tests de login
          - "cypress/e2e/bupa/bupa-navegacion*"  # job 2 — tests de navegación post-login
          - "cypress/e2e/bupa/bupa-citas*"       # job 3 — tests de citas médicas
          - "cypress/e2e/bupa/bupa-examenes*"    # job 4 — tests de exámenes
          - "cypress/e2e/bupa/bupa-perfil*"      # job 5 — tests de perfil paciente
          - "cypress/e2e/bupa/bupa-sesion*"      # job 6 — tests de sesión y logout
          - "cypress/e2e/bupa/bupa-responsive*"  # job 7 — tests de diseño responsive móvil
          - "cypress/e2e/bupa/bupa-performance*" # job 8 — tests de rendimiento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Correr spec ${{ matrix.spec }}   # ${{ matrix.spec }} toma el valor de cada item del matrix
        run: |
          npx cypress run \
            --spec "${{ matrix.spec }}" \                             # corre el spec del matrix actual
            --reporter mochawesome \                                  # usa el reporter que genera HTML
            --reporter-options "reportDir=cypress/reports/json,overwrite=false,html=false,json=true"  # guarda JSON para mergearlo después
        env:
          CYPRESS_BUPA_USER: ${{ secrets.BUPA_USER }}
          CYPRESS_BUPA_PASS: ${{ secrets.BUPA_PASS }}

      - name: Subir JSON del reporte
        uses: actions/upload-artifact@v4
        if: always()                              # sube el JSON aunque el spec haya fallado
        with:
          name: reporte-json-${{ strategy.job-index }}  # nombre único por cada job del matrix
          path: |
            cypress/reports/json/                 # JSONs individuales para merge posterior
            cypress/screenshots/
          retention-days: 1                       # solo necesita vivir 1 día — el Stage 5 los mergea

  # ─────────────────────────────────────────────────
  # STAGE 5 — REPORTE MOCHAWESOME (HTML unificado)
  # ─────────────────────────────────────────────────
  reporte-mochawesome:
    name: Generar Reporte HTML QA
    needs: tests-criticos                # espera que TODOS los jobs del matrix terminen
    runs-on: ubuntu-latest
    if: always()                         # corre aunque tests-criticos haya fallado — siempre generamos reporte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Descargar todos los JSONs de reportes
        uses: actions/download-artifact@v4        # descarga los artefactos que subió el Stage 4
        with:
          pattern: reporte-json-*                 # descarga todos los que empiecen con "reporte-json-"
          path: cypress/reports/json
          merge-multiple: true                    # los junta en una sola carpeta

      - name: Merge JSONs y generar HTML
        run: |
          npx mochawesome-merge "cypress/reports/json/**/*.json" \   # une todos los JSON en uno solo
            -o cypress/reports/merged-report.json
          npx marge cypress/reports/merged-report.json \             # convierte el JSON merged en HTML visual
            --reportDir cypress/reports/html \
            --reportTitle "BUPA Portal Pacientes — QA Report" \      # título que aparece en el reporte HTML
            --reportPageTitle "QA BUPA Chile" \
            --inline                                                  # CSS y JS embebidos — no necesita conexión para abrirlo
        continue-on-error: true                   # si el merge falla no bloquea el notify

      - name: Subir reporte HTML final
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-qa-mochawesome              # nombre del artefacto descargable en GitHub
          path: |
            cypress/reports/html/                  # reporte HTML visual completo
            cypress/reports/merged-report.json     # JSON raw por si se necesita procesar
          retention-days: 30                       # evidencia disponible 30 días

  # ─────────────────────────────────────────────────
  # STAGE 6 — NOTIFICAR RESULTADO
  # ─────────────────────────────────────────────────
  notify:
    name: Notificar resultado al equipo
    needs: [smoke-tests, tests-criticos, security, reporte-mochawesome]  # espera que TODOS los stages terminen
    runs-on: ubuntu-latest
    if: always()                         # corre siempre — necesitamos saber si pasó O falló
    steps:
      - name: Determinar estado final
        id: estado                       # id para referenciar los outputs de este step en los siguientes
        run: |
          if [ "${{ needs.smoke-tests.result }}" == "success" ] && [ "${{ needs.tests-criticos.result }}" == "success" ]; then
            echo "status=PASSED" >> $GITHUB_OUTPUT   # escribe la variable en el contexto del pipeline
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Notificar resultado a n8n
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \   # URL del webhook de n8n guardada en Secrets
            -H "Content-Type: application/json" \
            -d '{
              "pipeline": "BUPA Portal Pacientes",
              "status": "${{ steps.estado.outputs.status }}",   # PASSED o FAILED
              "emoji": "${{ steps.estado.outputs.emoji }}",     # ✅ o ❌
              "branch": "${{ github.ref_name }}",               # nombre del branch que disparó el pipeline
              "actor": "${{ github.actor }}",                   # usuario de GitHub que hizo el push
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"  # link directo al run
            }' || echo "n8n no disponible — notificación omitida"  # si n8n está caído no falla el pipeline

