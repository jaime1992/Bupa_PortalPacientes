name: BUPA — CI Feature (Smoke Only)
# Ambiente: DEV — corre solo en feature branches
# Objetivo: verificar rápido que el portal está vivo antes del PR
# Tiempo estimado: ~3 minutos

on:
  push:
    branches: [feature/bupa-*]           # solo se activa en branches de feature BUPA
  workflow_dispatch:                      # botón manual por si necesitas correrlo a mano

jobs:

  # ─────────────────────────────────────────────────
  # STAGE 1 — INSTALAR DEPENDENCIAS
  # ─────────────────────────────────────────────────
  install:
    name: Instalar dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

  # ─────────────────────────────────────────────────
  # STAGE 2 — SMOKE TESTS (portal vivo?)
  # Solo smoke — rápido para no frenar al desarrollador
  # ─────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests — Portal vivo
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Correr smoke tests BUPA
        run: npx cypress run --spec "cypress/e2e/bupa/bupa-smoke*"
        env:
          CYPRESS_BUPA_USER: ${{ secrets.BUPA_USER }}
          CYPRESS_BUPA_PASS: ${{ secrets.BUPA_PASS }}

      - name: Guardar evidencia smoke
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidencia-feature
          path: |
            cypress/reports/
            cypress/screenshots/
          retention-days: 7              # feature: solo 7 días de retención

  # ─────────────────────────────────────────────────
  # STAGE 3 — NOTIFICAR RESULTADO
  # ─────────────────────────────────────────────────
  notify:
    name: Notificar resultado al equipo
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determinar estado final
        id: estado
        run: |
          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "status=PASSED" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Notificar resultado a n8n
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "pipeline": "BUPA CI Feature",
              "status": "${{ steps.estado.outputs.status }}",
              "emoji": "${{ steps.estado.outputs.emoji }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "n8n no disponible — notificación omitida"
